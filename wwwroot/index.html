<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .add-todo-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
        }

        input[type="text"],
        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-secondary.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .todos-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .todo-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .todo-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left-color: #10b981;
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .todo-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: #999;
        }

        .todo-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .todo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .todo-date {
            font-size: 0.85em;
            color: #999;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .chatbot-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .chat-window {
            max-height: 320px;
            overflow-y: auto;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            padding: 10px 12px;
            border-radius: 10px;
            line-height: 1.4;
            max-width: 90%;
            word-break: break-word;
        }

        .chat-message.user {
            align-self: flex-end;
            background: #667eea;
            color: white;
        }

        .chat-message.bot {
            align-self: flex-start;
            background: #eef1ff;
            color: #1f2937;
            border: 1px solid #d9e0ff;
        }

        .chat-hint {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .todo-footer {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Todo List</h1>
            <p>Stay organized and productive</p>
        </div>

        <div class="card">
            <form class="add-todo-form" id="addTodoForm">
                <div class="input-group">
                    <label for="todoTitle">Task Title *</label>
                    <input type="text" id="todoTitle" placeholder="What needs to be done?" required>
                </div>
                <div class="input-group">
                    <label for="todoDescription">Description (optional)</label>
                    <textarea id="todoDescription" placeholder="Add more details..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">➕ Add Todo</button>
            </form>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="btn btn-secondary active" data-filter="all">All</button>
                <button class="btn btn-secondary" data-filter="pending">Pending</button>
                <button class="btn btn-secondary" data-filter="completed">Completed</button>
            </div>

            <div id="todosContainer">
                <div class="loading">Loading todos...</div>
            </div>
        </div>

        <div class="card">
            <h2 style="margin-bottom: 10px; color: #333;">🤖 Chatbot</h2>
            <p class="chat-hint">Send a message to the Azure AI Foundry-backed chatbot microservice.</p>
            <p class="chat-hint">Service URL: <code>http://localhost:5000/api/chatbot/message</code></p>

            <form class="chatbot-form" id="chatbotForm">
                <div class="input-group">
                    <label for="chatSystemPrompt">System Prompt (optional)</label>
                    <textarea id="chatSystemPrompt" placeholder="You are a helpful assistant."></textarea>
                </div>
                <div class="input-group">
                    <label for="chatMessage">Message *</label>
                    <textarea id="chatMessage" placeholder="Ask something..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>

            <div id="chatError" class="error-message" style="display: none;"></div>

            <div id="chatWindow" class="chat-window">
                <div class="chat-message bot">Hi! I am ready. Send a message to begin.</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/todo';
        const CHAT_SERVICE_BASE_URL = 'http://localhost:5000';
        const CHAT_API_BASE = `${CHAT_SERVICE_BASE_URL}/api/chatbot/message`;
        let currentFilter = 'all';
        let todos = [];
        const chatSessionId = `web-${Date.now()}`;

        // Load todos on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTodos();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Form submission
            document.getElementById('addTodoForm').addEventListener('submit', handleAddTodo);
            document.getElementById('chatbotForm').addEventListener('submit', handleSendMessage);

            // Filter buttons
            document.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentFilter = e.target.dataset.filter;
                    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderTodos();
                });
            });
        }

        async function loadTodos() {
            try {
                const response = await fetch(API_BASE);
                if (!response.ok) throw new Error('Failed to load todos');
                todos = await response.json();
                renderTodos();
                updateStats();
                hideError();
            } catch (error) {
                showError('Failed to load todos. Please try again.');
                console.error('Error loading todos:', error);
            }
        }

        async function handleAddTodo(e) {
            e.preventDefault();

            const title = document.getElementById('todoTitle').value.trim();
            const description = document.getElementById('todoDescription').value.trim();

            if (!title) return;

            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description: description || null })
                });

                if (!response.ok) throw new Error('Failed to add todo');

                const newTodo = await response.json();
                todos.push(newTodo);

                // Reset form
                document.getElementById('todoTitle').value = '';
                document.getElementById('todoDescription').value = '';

                renderTodos();
                updateStats();
                hideError();
            } catch (error) {
                showError('Failed to add todo. Please try again.');
                console.error('Error adding todo:', error);
            }
        }

        async function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: todo.title,
                        description: todo.description,
                        isCompleted: !todo.isCompleted
                    })
                });

                if (!response.ok) throw new Error('Failed to update todo');

                todo.isCompleted = !todo.isCompleted;
                todo.completedDate = todo.isCompleted ? new Date().toISOString() : null;

                renderTodos();
                updateStats();
                hideError();
            } catch (error) {
                showError('Failed to update todo. Please try again.');
                console.error('Error updating todo:', error);
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this todo?')) return;

            try {
                const response = await fetch(`${API_BASE}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete todo');

                todos = todos.filter(t => t.id !== id);
                renderTodos();
                updateStats();
                hideError();
            } catch (error) {
                showError('Failed to delete todo. Please try again.');
                console.error('Error deleting todo:', error);
            }
        }

        async function handleSendMessage(e) {
            e.preventDefault();

            const messageInput = document.getElementById('chatMessage');
            const systemPromptInput = document.getElementById('chatSystemPrompt');
            const message = messageInput.value.trim();
            const systemPrompt = systemPromptInput.value.trim();

            if (!message) return;

            appendChatMessage('user', message);
            messageInput.value = '';
            hideChatError();

            try {
                const response = await fetch(CHAT_API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        sessionId: chatSessionId,
                        systemPrompt: systemPrompt || null
                    })
                });

                if (!response.ok) {
                    const errorBody = await response.json().catch(() => null);
                    const errorMessage = errorBody?.message || 'Failed to get chatbot response.';
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                appendChatMessage('bot', data.reply || 'No response received.');
            } catch (error) {
                showChatError(error.message || 'Failed to get chatbot response. Ensure chatbot microservice is running on http://localhost:5000.');
                appendChatMessage('bot', 'Sorry, I could not process that request.');
                console.error('Error calling chatbot microservice:', error);
            }
        }

        function appendChatMessage(role, text) {
            const chatWindow = document.getElementById('chatWindow');
            const message = document.createElement('div');
            message.className = `chat-message ${role}`;
            message.innerHTML = escapeHtml(text);
            chatWindow.appendChild(message);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showChatError(message) {
            const errorDiv = document.getElementById('chatError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideChatError() {
            const errorDiv = document.getElementById('chatError');
            errorDiv.style.display = 'none';
        }

        function renderTodos() {
            const container = document.getElementById('todosContainer');

            let filteredTodos = todos;
            if (currentFilter === 'pending') {
                filteredTodos = todos.filter(t => !t.isCompleted);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.isCompleted);
            }

            if (filteredTodos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">No todos found</div>
                        <p>Add a new task to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="todos-list">
                    ${filteredTodos.map(todo => `
                        <div class="todo-item ${todo.isCompleted ? 'completed' : ''}">
                            <div class="todo-header">
                                <div class="todo-title">${escapeHtml(todo.title)}</div>
                            </div>
                            ${todo.description ? `<div class="todo-description">${escapeHtml(todo.description)}</div>` : ''}
                            <div class="todo-footer">
                                <div class="todo-date">
                                    Created: ${formatDate(todo.createdDate)}
                                    ${todo.completedDate ? `<br>Completed: ${formatDate(todo.completedDate)}` : ''}
                                </div>
                                <div class="todo-actions">
                                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                        <input type="checkbox" 
                                               class="checkbox" 
                                               ${todo.isCompleted ? 'checked' : ''}
                                               onchange="toggleTodo(${todo.id})">
                                        <span>${todo.isCompleted ? 'Completed' : 'Complete'}</span>
                                    </label>
                                    <button class="btn btn-danger" onclick="deleteTodo(${todo.id})">🗑️ Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.isCompleted).length;
            const pending = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;

            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
